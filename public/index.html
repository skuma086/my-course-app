<!DOCTYPE html>
<html>
<head>
    <title>My Course Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Welcome to My Course Academy</h1>
</header>

<section class="hero">
    <h2>Learn Skills for the Future</h2>
    <p>Select a course below</p>
</section>

<section class="courses">

    <div class="card" onclick="openCourse('webdev')">
        <h3>Web Development</h3>
        <p>Learn HTML, CSS, JavaScript</p>
    </div>

    <div class="card" onclick="openCourse('python')">
        <h3>Python Programming</h3>
        <p>Master Python from basics</p>
    </div>

    <div class="card" onclick="openCourse('digital')">
        <h3>Digital Marketing</h3>
        <p>Grow your business online</p>
    </div>

</section>

<section class="video-section">
    <h2>Watch Our Demo Class</h2>

    <!-- Option 1: Play inside website -->
    <iframe width="560" height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        frameborder="0" allowfullscreen>
    </iframe>

    <!-- Option 2: Redirect button -->
    <br><br>
    <a href="https://www.youtube.com" target="_blank">
        <button>Watch on YouTube</button>
    </a>
</section>

<script src="script.js"></script>
</body>
</html>
